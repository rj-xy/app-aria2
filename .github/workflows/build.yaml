---
name: Build

# Builds the aarch64 and amd64 images on every push and pull request.
# Publishing a GitHub release also pushes them to
# ghcr.io/<owner>/app-aria2/<arch>:<version>, which Home Assistant pulls.

# yamllint disable-line rule:truthy
on:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64
          - amd64
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the app's settings
        id: info
        env:
          ARCH: ${{ matrix.arch }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(yq --no-colors eval '.version' aria2/config.yaml)
          push=false
          if [[ $EVENT == release ]]; then
            if [[ ${TAG#v} != "$version" ]]; then
              echo "::error ::Release tag $TAG doesn't match version $version in aria2/config.yaml"
              exit 1
            fi
            push=true
          fi
          case $ARCH in
            aarch64) platform=linux/arm64/v8 ;;
            amd64) platform=linux/amd64 ;;
            *) echo "::error ::Unknown architecture $ARCH"; exit 1 ;;
          esac
          {
            echo "version=$version"
            echo "push=$push"
            echo "platform=$platform"
            echo "from=$(yq --no-colors eval ".build_from.$ARCH" aria2/build.yaml)"
            echo "name=$(yq --no-colors eval '.name' aria2/config.yaml)"
            echo "description=$(yq --no-colors eval '.description' aria2/config.yaml)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: steps.info.outputs.push == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, and push on a release
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: aria2
          file: aria2/Dockerfile
          platforms: ${{ steps.info.outputs.platform }}
          push: ${{ steps.info.outputs.push == 'true' }}
          tags: ghcr.io/${{ github.repository_owner }}/app-aria2/${{ matrix.arch }}:${{ steps.info.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_DATE=${{ steps.info.outputs.date }}
            BUILD_DESCRIPTION=${{ steps.info.outputs.description }}
            BUILD_FROM=${{ steps.info.outputs.from }}
            BUILD_NAME=${{ steps.info.outputs.name }}
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ steps.info.outputs.version }}
