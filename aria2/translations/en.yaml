---
configuration:
  download_dir:
    name: Download folder
    description: >-
      Where downloads go. Must be under /media or /share, for example
      /media/<network storage name>/downloads for a NAS added under
      Settings > System > Storage.
  require_mount:
    name: Only start when the folder is on its own storage
    description: >-
      Refuse to start unless the download folder is on network storage or a
      USB drive, so downloads can't fill the Home Assistant data disk when
      that storage is missing.
  concurrent_downloads:
    name: Downloads at once
    description: >-
      How many downloads run at the same time; the rest wait in the queue.
      Torrents that are only seeding don't count.
  connections_per_download:
    name: Connections per download
    description: >-
      How many connections one download may open to a server, to split a big
      file into parts. Some servers limit or block more than a few.
  max_download:
    name: Download limit
    description: >-
      Total download speed for all downloads, in bytes per second. Use K or
      M, for example 4M (32 Mbit/s). 0 means no limit.
  torrents:
    name: Allow torrents
    description: >-
      Magnet links and .torrent files. Torrents show your internet address to
      every peer. Off: aria2 refuses to add them and doesn't look for peers,
      and a .torrent file from a link is saved as a plain file.
  seed_ratio:
    name: Seed until ratio
    description: >-
      Stop seeding a finished torrent once it has uploaded this many times
      its size. 0 means no ratio limit.
  seed_time:
    name: Seed for at most (minutes)
    description: >-
      Stop seeding a finished torrent after this many minutes. 4320 is 3
      days. Seeding stops at whichever limit comes first.
  max_upload:
    name: Upload limit
    description: >-
      Total upload speed for all torrents, in bytes per second. Use K or M,
      for example 2M (16 Mbit/s). 0 means no limit.
  log_level:
    name: Log level
    description: >-
      How much aria2 writes to the app's log. notice shows each download
      starting and finishing; debug is very verbose.
