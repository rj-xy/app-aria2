# aria2 settings. Docs: https://aria2.github.io/manual/en/html/aria2c.html
# The download folder, seeding limits and upload limit come from the app's
# options (run.sh passes them on the command line).

# The queue survives restarts
input-file=/data/aria2.session
save-session=/data/aria2.session
save-session-interval=60

# RPC on localhost only: nginx in this container (HA ingress) is the only way in
enable-rpc=true
rpc-listen-all=false
rpc-listen-port=6800
rpc-max-request-size=10M

# Polite defaults: 3 downloads at once, up to 4 connections each
max-concurrent-downloads=3
max-connection-per-server=4
split=4
min-split-size=20M
continue=true

# Network shares don't like preallocation; a bit of write cache
file-allocation=none
disk-cache=32M

# BitTorrent: seeding torrents don't take one of the 3 download slots.
# No port is published, so aria2 only dials out to peers.
# DHT finds peers for magnets without trackers; its table survives restarts.
bt-detach-seed-only=true
enable-dht=true
dht-file-path=/data/dht.dat
dht-entry-point=dht.transmissionbt.com:6881

auto-file-renaming=true
allow-overwrite=false
console-log-level=notice
summary-interval=0
