# Torrents off: njs/rpc-filter.js reads each request and refuses the ones that
# add a torrent. It needs the whole body in memory, so the buffer is as big as
# the largest request allowed.
location = /jsonrpc {
    client_max_body_size 10m;
    client_body_buffer_size 10m;
    js_content rpc.filter;
}

location @aria2 {
    proxy_pass http://127.0.0.1:6800;
    proxy_read_timeout 1h;
}
