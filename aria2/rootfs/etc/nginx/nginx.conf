load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

user nginx;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;

    js_path /etc/nginx/njs/;
    js_import rpc from rpc-filter.js;

    server {
        listen 8099;

        # Only HA's ingress proxy (Supervisor) may connect
        allow 172.30.32.2;
        deny all;

        root /var/www/ariang;
        index index.html;

        # aria2's RPC: run.sh links rpc-torrents-on.conf or rpc-torrents-off.conf
        include /etc/nginx/rpc.conf;
    }
}
